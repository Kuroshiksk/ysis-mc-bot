
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YSIS-MC | Minecraft</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: #10151c;
      text-align: center;
    }
    header {
      padding: 35px 15px;
      background: linear-gradient(#152c24, #10151c);
      border-bottom: 4px solid #5cb85c;
    }
    h1 { font-size: 38px; margin: 10px 0; }
    h1 span { color: #73df72; }
    header p { color: #c5d3c7; }
    main { padding: 25px 16px; }
    .card {
      max-width: 430px;
      margin: 18px auto;
      padding: 22px;
      background: #1c2630;
      border: 2px solid #35483c;
      border-radius: 12px;
    }
    .emoji { font-size: 36px; }
    h2 { margin: 10px 0; }
    p { line-height: 1.5; color: #cbd5d1; }
    a.button {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 20px;
      background: #3e8e41;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 7px;
    }
    a.button:hover { background: #54aa57; }
    .soon { color: #f4d35e; font-weight: bold; }
    footer { padding: 22px; color: #84938c; }
  </style>
</head>
<body>
  <header>
    <div class="emoji">⛏️</div>
    <h1>YSIS-<span>MC</span></h1>
    <p>Sua próxima aventura começa aqui!</p>
  </header>

  <main>
    <section class="card">
      <div class="emoji">🌌</div>
      <h2>Servidor</h2>
      <p>Entre na nossa comunidade e prepare-se para explorar!</p>
      <a class="button"
         href="https://discord.gg/KhV35kxF35"
         target="_blank" rel="noopener">
        💬 Entrar no Discord
      </a>
    </section>

    <section class="card">
      <div class="emoji">👑</div>
      <h2>Créditos</h2>
      <p>Site criado por <strong>kuroshi</strong>.</p>
    </section>

    <section class="card">
      <div class="emoji">🛒</div>
      <h2>Loja</h2>
      <p class="soon">🔒 Em breve...</p>
    </section>
  </main>

  <footer>YSIS-MC © 2026 · Feito por kuroshi</footer>
</body>
</html>
